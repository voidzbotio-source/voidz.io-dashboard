<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Voidz.IO Dashboard — Sign Up</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --background: #0b0c10;

            --panel: #17181e;
            --panel-2: #1b1c23;
            --panel-solid: #17181e;

            --border: #262731;
            --border-strong: #33343f;

            --text: #eceef2;
            --muted: #8b8d98;

            --red: #f87171;
            --blue: #6366f1;
            --purple: #c084fc;
            --teal: #2dd4bf;

            --radius: 12px;
            --radius-sm: 8px;

            --shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        :root[data-theme="light"] {
            --background: #f7f7f9;

            --panel: #ffffff;
            --panel-2: #f2f3f6;
            --panel-solid: #ffffff;

            --border: #e5e6eb;
            --border-strong: #d3d4dc;

            --text: #14151a;
            --muted: #6b6d78;

            --blue: #6366f1;

            --shadow: 0 1px 2px rgba(20, 21, 26, 0.06);
            --shadow-lg: 0 8px 24px rgba(20, 21, 26, 0.1);
        }

        :root[data-theme="midnight"] {
            --background: #0e0c14;

            --panel: #191521;
            --panel-2: #1c1826;
            --panel-solid: #191521;

            --border: #292233;
            --border-strong: #362d43;

            --text: #f0ecf7;
            --muted: #938aa3;

            --blue: #c084fc;
            --purple: #c084fc;

            --shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        :root[data-theme="aurora"] {
            --background: #08120f;

            --panel: #131f1b;
            --panel-2: #16221d;
            --panel-solid: #131f1b;

            --border: #223330;
            --border-strong: #2c433f;

            --text: #eafaf5;
            --muted: #82a89c;

            --blue: #2dd4bf;

            --shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        :root[data-theme="sunset"] {
            --background: #140d09;

            --panel: #1f1710;
            --panel-2: #221a12;
            --panel-solid: #1f1710;

            --border: #332417;
            --border-strong: #42311f;

            --text: #faf0e6;
            --muted: #af9987;

            --blue: #fb923c;

            --shadow: 0 1px 2px rgba(0, 0, 0, 0.16);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.28);
        }

        html {
            color-scheme: dark;
        }

        html[data-theme="light"] {
            color-scheme: light;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: var(--background);

            color: var(--text);

            font-family: 'Inter', Arial, sans-serif;

            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* ================================================= */
        /* THEME PICKER */
        /* ================================================= */

        .theme-picker-float {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 9px 12px;

            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: 999px;

            box-shadow: var(--shadow);
        }

        .theme-swatch {
            width: 20px;
            height: 20px;
            padding: 0;

            border-radius: 50%;
            border: 2px solid transparent;

            box-shadow: 0 0 0 1px var(--border);

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease;
        }

        .theme-swatch:hover {
            transform: scale(1.1);
        }

        .theme-swatch.active {
            border-color: var(--text);
        }

        .custom-swatch {
            position: relative;

            background: conic-gradient(
                from 180deg,
                #f87171, #fbbf24, #34d399, #6366f1, #c084fc, #f87171
            );
        }

        .custom-swatch input[type="color"] {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            opacity: 0;

            border: none;
            padding: 0;

            cursor: pointer;
        }

        .theme-custom-reset {
            width: 20px;
            height: 20px;
            padding: 0;

            display: none;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            border: 1px solid var(--border);

            background: transparent;
            color: var(--muted);

            font-size: 10px;
            line-height: 1;

            cursor: pointer;

            transition:
                color 0.15s ease,
                border-color 0.15s ease;
        }

        .theme-custom-reset:hover {
            color: var(--red);
            border-color: var(--red);
        }

        /* ================================================= */
        /* CARD */
        /* ================================================= */

        .card {
            position: relative;

            width: 100%;
            max-width: 380px;

            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            padding: 32px 28px;

            box-shadow: var(--shadow-lg);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 26px;
        }

        .logo {
            width: 42px;
            height: 42px;
            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: var(--radius-sm);

            background: linear-gradient(135deg, var(--blue), var(--purple));

            font-size: 17px;
            font-weight: 800;
            color: #fff;
        }

        .brand h1 {
            margin: 0;

            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12.5px;
        }

        label {
            display: block;

            font-size: 11px;
            font-weight: 700;
            color: var(--muted);

            text-transform: uppercase;
            letter-spacing: 0.06em;

            margin-bottom: 6px;
        }

        .field {
            margin-bottom: 16px;
        }

        .hint {
            margin: -10px 0 16px;
            color: var(--muted);
            font-size: 11.5px;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid var(--border);
            border-radius: var(--radius-sm);

            background: var(--panel-2);
            color: var(--text);

            font-family: inherit;
            font-size: 14px;
            font-weight: 500;

            outline: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);
        }

        button {
            width: 100%;

            margin-top: 6px;

            padding: 13px;

            border-radius: var(--radius-sm);
            border: 1px solid var(--border-strong);

            background: var(--blue);
            color: #fff;

            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;

            cursor: pointer;

            transition:
                opacity 0.15s ease,
                transform 0.15s ease;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .error {
            display: none;

            margin-bottom: 16px;
            padding: 10px 12px;

            border-radius: var(--radius-sm);

            background: color-mix(in srgb, var(--red) 12%, transparent);
            border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);

            color: var(--red);

            font-size: 13px;
        }

        .error.show {
            display: block;
        }

        .back-link {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: var(--muted);
            font-size: 13px;
        }

        .back-link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="theme-picker-float" id="themeSwatches">

        <button class="theme-swatch" data-theme-value="dark" onclick="setTheme('dark')" title="Dark" style="background: linear-gradient(135deg, #0b0c10 50%, #6366f1 50%);"></button>
        <button class="theme-swatch" data-theme-value="light" onclick="setTheme('light')" title="Light" style="background: linear-gradient(135deg, #f7f7f9 50%, #6366f1 50%);"></button>
        <button class="theme-swatch" data-theme-value="midnight" onclick="setTheme('midnight')" title="Midnight" style="background: linear-gradient(135deg, #0e0c14 50%, #c084fc 50%);"></button>
        <button class="theme-swatch" data-theme-value="aurora" onclick="setTheme('aurora')" title="Aurora" style="background: linear-gradient(135deg, #08120f 50%, #2dd4bf 50%);"></button>
        <button class="theme-swatch" data-theme-value="sunset" onclick="setTheme('sunset')" title="Sunset" style="background: linear-gradient(135deg, #140d09 50%, #fb923c 50%);"></button>

        <label class="theme-swatch custom-swatch" id="customAccentSwatch" title="Custom accent color">
            <input type="color" id="customAccentInput" value="#6366f1" oninput="setCustomAccent(this.value)">
        </label>

        <button class="theme-custom-reset" id="customAccentReset" title="Reset accent color" onclick="clearCustomAccent()">&#10005;</button>

    </div>

    <div class="card">

        <div class="brand">

            <div class="logo">V</div>

            <div>
                <h1>Voidz.IO</h1>
                <p>Create an Account</p>
            </div>

        </div>

        <div id="error" class="error"></div>

        <form id="signupForm">

            <div class="field">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="Username"
                    minlength="3"
                    maxlength="20"
                    required
                >
            </div>

            <div class="hint">3-20 characters: letters, numbers, underscores.</div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Password"
                    minlength="8"
                    required
                >
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="Confirm password"
                    minlength="8"
                    required
                >
            </div>

            <div class="hint">At least 8 characters.</div>

            <button id="submitBtn" type="submit">
                Create Account
            </button>

        </form>

        <div class="back-link">
            Already have an account? <a href="/login">Log in</a>
        </div>

    </div>

    <script>

        'use strict'

        // ==================================================
        // THEME
        // ==================================================

        const THEMES = ['dark', 'light', 'midnight', 'aurora', 'sunset']
        const CUSTOM_ACCENT_PROPS = ['--blue', '--border', '--border-strong']

        function applyTheme(theme) {

            if (!THEMES.includes(theme)) {
                theme = 'dark'
            }

            document.documentElement.setAttribute('data-theme', theme)

            document.querySelectorAll('.theme-swatch').forEach(
                el => {

                    el.classList.toggle(
                        'active',
                        el.dataset.themeValue === theme
                    )

                }
            )

        }

        function setTheme(theme) {

            const root = document.documentElement

            CUSTOM_ACCENT_PROPS.forEach(
                prop => root.style.removeProperty(prop)
            )

            applyTheme(theme)

            const resetBtn = document.getElementById('customAccentReset')

            if (resetBtn) {
                resetBtn.style.display = 'none'
            }

            try {

                localStorage.setItem('fleaxer-theme', theme)
                localStorage.removeItem('fleaxer-accent')

            } catch {}

        }

        function hexToRgb(hex) {

            const clean = hex.replace('#', '')

            const full =
                clean.length === 3
                    ? clean.split('').map(c => c + c).join('')
                    : clean

            const num = parseInt(full, 16)

            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            }

        }

        function setCustomAccent(hex) {

            const { r, g, b } = hexToRgb(hex)
            const root = document.documentElement

            root.style.setProperty('--blue', hex)
            root.style.setProperty('--border', `rgba(${r}, ${g}, ${b}, 0.28)`)
            root.style.setProperty('--border-strong', `rgba(${r}, ${g}, ${b}, 0.6)`)

            document.querySelectorAll('.theme-swatch').forEach(
                el => el.classList.remove('active')
            )

            const customSwatch = document.getElementById('customAccentSwatch')

            if (customSwatch) {
                customSwatch.classList.add('active')
            }

            const input = document.getElementById('customAccentInput')

            if (input) {
                input.value = hex
            }

            const resetBtn = document.getElementById('customAccentReset')

            if (resetBtn) {
                resetBtn.style.display = 'inline-flex'
            }

            try {

                localStorage.setItem('fleaxer-accent', hex)

            } catch {}

        }

        function clearCustomAccent() {

            const current =
                document.documentElement.getAttribute('data-theme') || 'dark'

            setTheme(current)

        }

        function initTheme() {

            let stored = null

            try {

                stored = localStorage.getItem('fleaxer-theme')

            } catch {}

            if (stored && THEMES.includes(stored)) {

                applyTheme(stored)

            } else {

                const prefersLight =
                    window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: light)').matches

                applyTheme(prefersLight ? 'light' : 'dark')

            }

            let customAccent = null

            try {

                customAccent = localStorage.getItem('fleaxer-accent')

            } catch {}

            if (customAccent) {
                setCustomAccent(customAccent)
            }

        }

        initTheme()

        // ==================================================
        // SIGNUP FORM
        // ==================================================

        const form = document.getElementById('signupForm')
        const errorBox = document.getElementById('error')
        const submitBtn = document.getElementById('submitBtn')

        form.addEventListener('submit', event => {

            event.preventDefault()

            errorBox.classList.remove('show')
            errorBox.textContent = ''

            const username = document.getElementById('username').value.trim()
            const password = document.getElementById('password').value
            const confirmPassword = document.getElementById('confirmPassword').value

            if (password !== confirmPassword) {

                errorBox.textContent = 'Passwords do not match.'
                errorBox.classList.add('show')

                return

            }

            submitBtn.disabled = true
            submitBtn.textContent = 'Creating account...'

            fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
                .then(response => response.json().then(data => ({ ok: response.ok, data })))
                .then(({ ok, data }) => {

                    if (ok && data.ok) {

                        try {

                            sessionStorage.setItem('voidz-show-welcome', '1')
                            sessionStorage.setItem('voidz-new-account', '1')

                        } catch {}

                        window.location.href = '/'

                        return

                    }

                    errorBox.textContent = data.error || 'Could not create account.'
                    errorBox.classList.add('show')

                    submitBtn.disabled = false
                    submitBtn.textContent = 'Create Account'

                })
                .catch(() => {

                    errorBox.textContent = 'Could not reach the server. Try again.'
                    errorBox.classList.add('show')

                    submitBtn.disabled = false
                    submitBtn.textContent = 'Create Account'

                })

        })

    </script>

</body>

</html>
