<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Voidz.IO Dashboard — Sign Up</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --background: #0a0a12;
            --bg-glow-1: rgba(99, 102, 241, 0.16);
            --bg-glow-2: rgba(168, 85, 247, 0.1);

            --panel: rgba(255, 255, 255, 0.09);
            --panel-2: rgba(255, 255, 255, 0.06);
            --panel-2-solid: #1d1e26;
            --panel-solid: #17181f;

            --border: rgba(255, 255, 255, 0.22);
            --border-strong: rgba(255, 255, 255, 0.4);

            --text: #f5f6fa;
            --muted: #a3a5b5;

            --red: #f87171;
            --blue: #818cf8;
            --purple: #c084fc;
            --teal: #2dd4bf;

            --radius: 22px;

            --shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.4);

            --gx: 50%;
            --gy: 40%;
            --mx: 0px;
            --my: 0px;
        }

        :root[data-theme="light"] {
            --background: #eef0f7;
            --bg-glow-1: rgba(99, 102, 241, 0.14);
            --bg-glow-2: rgba(192, 132, 252, 0.1);

            --panel: rgba(255, 255, 255, 0.55);
            --panel-2: rgba(255, 255, 255, 0.35);
            --panel-2-solid: #f5f6fb;
            --panel-solid: #ffffff;

            --border: rgba(255, 255, 255, 0.65);
            --border-strong: rgba(255, 255, 255, 0.9);

            --text: #1c1d2b;
            --muted: #5c5e70;

            --blue: #6366f1;

            --shadow: 0 8px 32px rgba(30, 32, 60, 0.1);
            --shadow-lg: 0 16px 56px rgba(30, 32, 60, 0.16);
        }

        :root[data-theme="midnight"] {
            --background: #140f1e;
            --bg-glow-1: rgba(192, 132, 252, 0.18);
            --bg-glow-2: rgba(232, 121, 249, 0.1);

            --panel: rgba(255, 255, 255, 0.08);
            --panel-2: rgba(192, 132, 252, 0.08);
            --panel-2-solid: #241d33;
            --panel-solid: #1c1628;

            --border: rgba(192, 132, 252, 0.3);
            --border-strong: rgba(192, 132, 252, 0.5);

            --text: #f5eeff;
            --muted: #b3a6c4;

            --blue: #c084fc;
            --purple: #c084fc;

            --shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.4);
        }

        :root[data-theme="aurora"] {
            --background: #0a1614;
            --bg-glow-1: rgba(45, 212, 191, 0.18);
            --bg-glow-2: rgba(52, 211, 153, 0.1);

            --panel: rgba(255, 255, 255, 0.08);
            --panel-2: rgba(45, 212, 191, 0.08);
            --panel-2-solid: #182b25;
            --panel-solid: #12211d;

            --border: rgba(45, 212, 191, 0.3);
            --border-strong: rgba(45, 212, 191, 0.5);

            --text: #eafff9;
            --muted: #93bdb0;

            --blue: #2dd4bf;

            --shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.4);
        }

        :root[data-theme="sunset"] {
            --background: #170f0a;
            --bg-glow-1: rgba(251, 146, 60, 0.18);
            --bg-glow-2: rgba(248, 113, 113, 0.1);

            --panel: rgba(255, 255, 255, 0.08);
            --panel-2: rgba(251, 146, 60, 0.08);
            --panel-2-solid: #2b1e15;
            --panel-solid: #221710;

            --border: rgba(251, 146, 60, 0.3);
            --border-strong: rgba(251, 146, 60, 0.5);

            --text: #fff3ea;
            --muted: #c2a695;

            --blue: #fb923c;

            --shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
            --shadow-lg: 0 16px 56px rgba(0, 0, 0, 0.4);
        }

        html {
            color-scheme: dark;
        }

        html[data-theme="light"] {
            color-scheme: light;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background: var(--background);

            color: var(--text);

            font-family: 'Inter', Arial, sans-serif;

            perspective: 1200px;

            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* ================================================= */
        /* ANIMATED BACKGROUND */
        /* ================================================= */

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;

            overflow: hidden;
            pointer-events: none;
        }

        .bg::before {
            content: '';
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(color-mix(in srgb, var(--purple) 6%, transparent) 1px, transparent 1px),
                linear-gradient(90deg, color-mix(in srgb, var(--purple) 6%, transparent) 1px, transparent 1px);

            background-size: 42px 42px;

            -webkit-mask-image: radial-gradient(circle at var(--gx) var(--gy), black, transparent 60%);
            mask-image: radial-gradient(circle at var(--gx) var(--gy), black, transparent 60%);
        }

        .cursor-glow {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at var(--gx) var(--gy),
                    color-mix(in srgb, var(--purple) 18%, transparent),
                    transparent 32%
                );

            mix-blend-mode: screen;
        }

        .orb-shift {
            transform:
                translate3d(
                    calc(var(--mx) * var(--depth, 1)),
                    calc(var(--my) * var(--depth, 1)),
                    0
                );

            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            opacity: 0.55;
            will-change: transform;
        }

        .orb-1 {
            width: 540px;
            height: 540px;
            top: -170px;
            right: -150px;
            background: radial-gradient(circle, var(--purple), transparent 70%);
            animation: float-a 24s ease-in-out infinite;
        }

        .orb-2 {
            width: 480px;
            height: 480px;
            bottom: -170px;
            left: -150px;
            background: radial-gradient(circle, var(--blue), transparent 70%);
            animation: float-b 28s ease-in-out infinite;
        }

        .orb-3 {
            width: 380px;
            height: 380px;
            top: 45%;
            left: 55%;
            background: radial-gradient(circle, var(--teal), transparent 70%);
            opacity: 0.4;
            animation: float-c 32s ease-in-out infinite;
        }

        @keyframes float-a {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-60px, 50px) scale(1.12); }
        }

        @keyframes float-b {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, -40px) scale(1.08); }
        }

        @keyframes float-c {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-55%, -45%) scale(1.2); }
        }

        @media (prefers-reduced-motion: reduce) {
            .orb {
                animation: none;
                display: none;
            }
        }

        /* ================================================= */
        /* THEME PICKER */
        /* ================================================= */

        .theme-picker-float {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;

            display: flex;
            align-items: center;
            gap: 9px;

            padding: 9px 12px;

            background: var(--panel);
            backdrop-filter: blur(24px) saturate(180%);

            border: 1px solid var(--border);
            border-radius: 999px;

            box-shadow: var(--shadow);
        }

        .theme-swatch {
            width: 20px;
            height: 20px;
            padding: 0;

            border-radius: 50%;
            border: 2px solid transparent;

            box-shadow: 0 0 0 1px var(--border);

            cursor: pointer;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease;
        }

        .theme-swatch:hover {
            transform: scale(1.14);
            box-shadow: 0 0 0 1px var(--border-strong);
        }

        .theme-swatch.active {
            border-color: var(--text);
        }

        .custom-swatch {
            position: relative;

            background: conic-gradient(
                from 180deg,
                #ef4444, #eab308, #22c55e, #6366f1, #a855f7, #ef4444
            );
        }

        .custom-swatch input[type="color"] {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            opacity: 0;

            border: none;
            padding: 0;

            cursor: pointer;
        }

        .theme-custom-reset {
            width: 20px;
            height: 20px;
            padding: 0;

            display: none;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            border: 1px solid var(--border);

            background: transparent;
            color: var(--muted);

            font-size: 10px;
            line-height: 1;

            cursor: pointer;

            transition:
                color 0.15s ease,
                border-color 0.15s ease;
        }

        .theme-custom-reset:hover {
            color: var(--red);
            border-color: var(--red);
        }

        /* ================================================= */
        /* CARD */
        /* ================================================= */

        .card {
            position: relative;
            z-index: 1;

            width: 100%;
            max-width: 380px;

            background: var(--panel);
            backdrop-filter: blur(28px) saturate(180%);

            border: 1px solid var(--border);
            border-radius: var(--radius);

            padding: 32px 28px;

            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255, 255, 255, 0.14);

            overflow: hidden;
            transform-style: preserve-3d;

            transition:
                transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s ease,
                background-color 0.25s ease,
                border-color 0.25s ease;
        }

        .card.tilting {
            border-color: var(--border-strong);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at var(--sx, 50%) var(--sy, 40%),
                    color-mix(in srgb, var(--purple) 30%, transparent),
                    transparent 55%
                );

            opacity: 0;

            transition: opacity 0.3s ease;

            pointer-events: none;

            mix-blend-mode: screen;
        }

        .card.tilting::before {
            opacity: 1;
        }

        .card > * {
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;

            margin-bottom: 26px;
        }

        .logo {
            width: 46px;
            height: 46px;
            flex-shrink: 0;

            filter: drop-shadow(0 6px 16px color-mix(in srgb, var(--purple) 25%, transparent));
        }

        .brand h1 {
            margin: 0;

            font-family: 'Inter', sans-serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .brand p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12px;
        }

        label {
            display: block;

            font-size: 11.5px;
            font-weight: 700;
            color: var(--muted);

            text-transform: uppercase;
            letter-spacing: 0.08em;

            margin-bottom: 6px;
        }

        .field {
            margin-bottom: 16px;
        }

        .hint {
            margin: -10px 0 16px;
            color: var(--muted);
            font-size: 11.5px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid var(--border);
            border-radius: var(--radius);

            background: var(--panel-2);
            color: var(--text);

            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 500;

            outline: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        input::placeholder {
            color: var(--muted);
        }

        input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--purple) 18%, transparent);
        }

        button {
            width: 100%;

            margin-top: 6px;

            padding: 14px;

            border-radius: var(--radius);
            border: 1px solid transparent;

            background: var(--purple);
            color: #fff;

            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background-color 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        button:hover:not(:disabled) {
            background: color-mix(in srgb, var(--purple) 88%, black);
            box-shadow: var(--shadow);
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.55;
            cursor: default;
        }

        .error {
            display: none;

            margin-bottom: 16px;
            padding: 10px 12px;

            border-radius: var(--radius);

            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.35);

            color: var(--red);

            font-size: 13px;
        }

        .error.show {
            display: block;
        }

        .back-link {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: var(--muted);
            font-size: 13px;
        }

        .back-link a {
            color: var(--blue);
            text-decoration: none;
            font-weight: 700;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="bg">

        <div class="cursor-glow"></div>

        <div class="orb-shift" style="--depth: 1;">
            <div class="orb orb-1"></div>
        </div>

        <div class="orb-shift" style="--depth: -0.7;">
            <div class="orb orb-2"></div>
        </div>

        <div class="orb-shift" style="--depth: 1.6;">
            <div class="orb orb-3"></div>
        </div>

    </div>

    <div class="theme-picker-float" id="themeSwatches">

        <button class="theme-swatch" data-theme-value="dark" onclick="setTheme('dark')" title="Dark" style="background: linear-gradient(135deg, #0b0c0f 50%, #6366f1 50%);"></button>
        <button class="theme-swatch" data-theme-value="light" onclick="setTheme('light')" title="Light" style="background: linear-gradient(135deg, #fafafa 50%, #4f46e5 50%);"></button>
        <button class="theme-swatch" data-theme-value="midnight" onclick="setTheme('midnight')" title="Midnight" style="background: linear-gradient(135deg, #0e0b14 50%, #a855f7 50%);"></button>
        <button class="theme-swatch" data-theme-value="aurora" onclick="setTheme('aurora')" title="Aurora" style="background: linear-gradient(135deg, #0a1210 50%, #22c55e 50%);"></button>
        <button class="theme-swatch" data-theme-value="sunset" onclick="setTheme('sunset')" title="Sunset" style="background: linear-gradient(135deg, #120d0a 50%, #f97316 50%);"></button>

        <label class="theme-swatch custom-swatch" id="customAccentSwatch" title="Custom accent color">
            <input type="color" id="customAccentInput" value="#6366f1" oninput="setCustomAccent(this.value)">
        </label>

        <button class="theme-custom-reset" id="customAccentReset" title="Reset accent color" onclick="clearCustomAccent()">&#10005;</button>

    </div>

    <div class="card">

        <div class="brand">

            <svg class="logo" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="voidzMarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--purple)"/>
                        <stop offset="100%" style="stop-color:var(--blue)"/>
                    </linearGradient>
                </defs>
                <polygon points="50,3 95,26 95,74 50,97 5,74 5,26" fill="none" stroke="url(#voidzMarkGrad)" stroke-width="3.2" stroke-linejoin="round"/>
                <path d="M28 25 L50 79" fill="none" stroke="url(#voidzMarkGrad)" stroke-width="12" stroke-linecap="square"/>
                <path d="M72 25 L50 79" fill="none" stroke="url(#voidzMarkGrad)" stroke-width="12" stroke-linecap="square"/>
                <circle cx="50" cy="79" r="10" fill="var(--panel-solid)" stroke="var(--teal)" stroke-width="1.6" opacity="0.95"/>
                <circle cx="50" cy="79" r="2.4" fill="var(--text)"/>
            </svg>

            <div>
                <h1>Voidz.IO</h1>
                <p>Create an Account</p>
            </div>

        </div>

        <div id="error" class="error"></div>

        <form id="signupForm">

            <div class="field">
                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    placeholder="USERNAME"
                    minlength="3"
                    maxlength="20"
                    required
                >
            </div>

            <div class="hint">3-20 characters: letters, numbers, underscores.</div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="new-password"
                    placeholder="PASSWORD"
                    minlength="8"
                    required
                >
            </div>

            <div class="field">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    autocomplete="new-password"
                    placeholder="CONFIRM PASSWORD"
                    minlength="8"
                    required
                >
            </div>

            <div class="hint">At least 8 characters.</div>

            <button id="submitBtn" type="submit">
                Create Account
            </button>

        </form>

        <div class="back-link">
            Already have an account? <a href="/login">Log in</a>
        </div>

    </div>

    <script>

        'use strict'

        // ==================================================
        // THEME
        // ==================================================

        const THEMES = ['dark', 'light', 'midnight', 'aurora', 'sunset']
        const CUSTOM_ACCENT_PROPS = [
            '--blue', '--border', '--border-strong',
            '--bg-glow-1', '--shadow', '--shadow-lg'
        ]

        function applyTheme(theme) {

            if (!THEMES.includes(theme)) {
                theme = 'dark'
            }

            document.documentElement.setAttribute('data-theme', theme)

            document.querySelectorAll('.theme-swatch').forEach(
                el => {

                    el.classList.toggle(
                        'active',
                        el.dataset.themeValue === theme
                    )

                }
            )

        }

        function setTheme(theme) {

            const root = document.documentElement

            CUSTOM_ACCENT_PROPS.forEach(
                prop => root.style.removeProperty(prop)
            )

            applyTheme(theme)

            const resetBtn = document.getElementById('customAccentReset')

            if (resetBtn) {
                resetBtn.style.display = 'none'
            }

            try {

                localStorage.setItem('fleaxer-theme', theme)
                localStorage.removeItem('fleaxer-accent')

            } catch {}

        }

        function hexToRgb(hex) {

            const clean = hex.replace('#', '')

            const full =
                clean.length === 3
                    ? clean.split('').map(c => c + c).join('')
                    : clean

            const num = parseInt(full, 16)

            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            }

        }

        function setCustomAccent(hex) {

            const { r, g, b } = hexToRgb(hex)
            const root = document.documentElement

            root.style.setProperty('--blue', hex)
            root.style.setProperty('--border', `rgba(${r}, ${g}, ${b}, 0.28)`)
            root.style.setProperty('--border-strong', `rgba(${r}, ${g}, ${b}, 0.6)`)
            root.style.setProperty('--bg-glow-1', `rgba(${r}, ${g}, ${b}, 0.16)`)
            root.style.setProperty('--shadow', `0 0 24px rgba(${r}, ${g}, ${b}, 0.18), 0 10px 30px rgba(0, 0, 0, 0.55)`)
            root.style.setProperty('--shadow-lg', `0 0 40px rgba(${r}, ${g}, ${b}, 0.28), 0 20px 55px rgba(0, 0, 0, 0.65)`)

            document.querySelectorAll('.theme-swatch').forEach(
                el => el.classList.remove('active')
            )

            const customSwatch = document.getElementById('customAccentSwatch')

            if (customSwatch) {
                customSwatch.classList.add('active')
            }

            const input = document.getElementById('customAccentInput')

            if (input) {
                input.value = hex
            }

            const resetBtn = document.getElementById('customAccentReset')

            if (resetBtn) {
                resetBtn.style.display = 'inline-flex'
            }

            try {

                localStorage.setItem('fleaxer-accent', hex)

            } catch {}

        }

        function clearCustomAccent() {

            const current =
                document.documentElement.getAttribute('data-theme') || 'dark'

            setTheme(current)

        }

        function initTheme() {

            let stored = null

            try {

                stored = localStorage.getItem('fleaxer-theme')

            } catch {}

            if (stored && THEMES.includes(stored)) {

                applyTheme(stored)

            } else {

                const prefersLight =
                    window.matchMedia &&
                    window.matchMedia('(prefers-color-scheme: light)').matches

                applyTheme(prefersLight ? 'light' : 'dark')

            }

            let customAccent = null

            try {

                customAccent = localStorage.getItem('fleaxer-accent')

            } catch {}

            if (customAccent) {
                setCustomAccent(customAccent)
            }

        }

        initTheme()

        // ==================================================
        // CURSOR-REACTIVE BACKGROUND
        // ==================================================

        const reduceMotion =
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches

        if (!reduceMotion) {

            const root = document.documentElement

            let pointerX = window.innerWidth / 2
            let pointerY = window.innerHeight / 2

            let frameQueued = false

            function applyPointer() {

                frameQueued = false

                const gx = (pointerX / window.innerWidth) * 100
                const gy = (pointerY / window.innerHeight) * 100

                root.style.setProperty('--gx', `${gx}%`)
                root.style.setProperty('--gy', `${gy}%`)

                const dx = pointerX - window.innerWidth / 2
                const dy = pointerY - window.innerHeight / 2

                const mx = Math.max(-22, Math.min(22, dx * 0.035))
                const my = Math.max(-22, Math.min(22, dy * 0.035))

                root.style.setProperty('--mx', `${mx}px`)
                root.style.setProperty('--my', `${my}px`)

            }

            function onPointerMove(x, y) {

                pointerX = x
                pointerY = y

                if (!frameQueued) {

                    frameQueued = true

                    requestAnimationFrame(applyPointer)

                }

            }

            window.addEventListener('mousemove', event => {

                onPointerMove(event.clientX, event.clientY)

            })

            window.addEventListener('touchmove', event => {

                const touch = event.touches[0]

                if (touch) {
                    onPointerMove(touch.clientX, touch.clientY)
                }

            }, { passive: true })

            // ----------------------------------------------
            // CARD TILT + SHEEN
            // ----------------------------------------------

            const cardEl = document.querySelector('.card')

            if (cardEl) {

                cardEl.addEventListener('mousemove', event => {

                    const rect = cardEl.getBoundingClientRect()

                    const relX = (event.clientX - rect.left) / rect.width
                    const relY = (event.clientY - rect.top) / rect.height

                    const rotateY = (relX - 0.5) * 14
                    const rotateX = (0.5 - relY) * 14

                    cardEl.style.setProperty('--sx', `${relX * 100}%`)
                    cardEl.style.setProperty('--sy', `${relY * 100}%`)

                    cardEl.style.transform =
                        `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`

                })

                cardEl.addEventListener('mouseenter', () => {

                    cardEl.classList.add('tilting')

                })

                cardEl.addEventListener('mouseleave', () => {

                    cardEl.classList.remove('tilting')

                    cardEl.style.transform = ''

                })

            }

        }

        const form = document.getElementById('signupForm')
        const errorBox = document.getElementById('error')
        const submitBtn = document.getElementById('submitBtn')

        form.addEventListener('submit', event => {

            event.preventDefault()

            errorBox.classList.remove('show')
            errorBox.textContent = ''

            const username = document.getElementById('username').value.trim()
            const password = document.getElementById('password').value
            const confirmPassword = document.getElementById('confirmPassword').value

            if (password !== confirmPassword) {

                errorBox.textContent = 'Passwords do not match.'
                errorBox.classList.add('show')

                return

            }

            submitBtn.disabled = true
            submitBtn.textContent = 'Creating account...'

            fetch('/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
                .then(response => response.json().then(data => ({ ok: response.ok, data })))
                .then(({ ok, data }) => {

                    if (ok && data.ok) {

                        try {

                            sessionStorage.setItem('voidz-show-welcome', '1')
                            sessionStorage.setItem('voidz-new-account', '1')

                        } catch {}

                        window.location.href = '/'

                        return

                    }

                    errorBox.textContent = data.error || 'Could not create account.'
                    errorBox.classList.add('show')

                    submitBtn.disabled = false
                    submitBtn.textContent = 'Create Account'

                })
                .catch(() => {

                    errorBox.textContent = 'Could not reach the server. Try again.'
                    errorBox.classList.add('show')

                    submitBtn.disabled = false
                    submitBtn.textContent = 'Create Account'

                })

        })

    </script>

</body>

</html>
